apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: owlsm
  labels:
    {{- include "owlsm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: owlsm
subjects:
  - kind: ServiceAccount
    name: owlsm
    namespace: {{ .Release.Namespace }}
