name: build-cybereason-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to repackage (e.g. v1.0.0)'
        required: true
        type: string

# Least privilege at the workflow level; the job widens only what it needs.
permissions:
  contents: read

# Serialize all runs: every run pushes to the same releases branch, so they
# must not overlap (the publish step also retries defensively).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOCKER_IMAGE: ghcr.io/cybereason-public/owlsm-ci:latest

jobs:
  build-cybereason-release:
    name: Build Cybereason Release
    runs-on: ["OCI", "owLSM"]
    permissions:
      contents: write   # push the tarball onto the owlsm_cybereason_releases branch
    steps:
      # ---------------------------------------------------------------
      # (a) Checkout
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ---------------------------------------------------------------
      # Validate the tag input and derive the version (strip leading 'v')
      # ---------------------------------------------------------------
      - name: Validate input and resolve metadata
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must match vX.Y.Z format, got '$TAG'"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG | Version: $VERSION | Assets: owlsm-{x86_64,aarch64}-v${VERSION}.tar.gz"

      # ---------------------------------------------------------------
      # (b) Validate the release tag exists AND the asset is present
      # ---------------------------------------------------------------
      - name: Verify release and assets exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          REPO="${{ github.repository }}"
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" || {
            echo "::error::Tag ${TAG} does not exist on remote."; exit 1
          }
          gh release view "$TAG" --repo "$REPO" >/dev/null || {
            echo "::error::Release ${TAG} not found. Run Publish GitHub Release first."; exit 1
          }
          for arch in x86_64 aarch64; do
            ASSET="owlsm-${arch}-v${VERSION}.tar.gz"
            FOUND=$(gh release view "$TAG" --repo "$REPO" --json assets \
              --jq ".assets[] | select(.name == \"${ASSET}\") | .name")
            [ -n "$FOUND" ] || { echo "::error::Asset ${ASSET} missing on ${TAG}"; exit 1; }
            echo "==> Found $FOUND"
          done

      - name: Build Cybereason tarballs (both arches)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          docker run --privileged --rm tonistiigi/binfmt --install all
          docker pull --platform linux/amd64 ${{ env.DOCKER_IMAGE }}
          docker pull --platform linux/arm64 ${{ env.DOCKER_IMAGE }}
          rm -rf release-download extract
          mkdir -p release-download
          for arch in x86_64 aarch64; do
            case "$arch" in x86_64) platform=linux/amd64 ;; aarch64) platform=linux/arm64 ;; esac
            ASSET="owlsm-${arch}-v${VERSION}.tar.gz"
            OUT="owlsm-${arch}-v${VERSION}-cybereason.tar.gz"
            docker run --rm --platform "$platform" \
              -v "${{ github.workspace }}:/workspace" -w /workspace \
              ${{ env.DOCKER_IMAGE }} \
              bash -c "set -e; bash scripts/CR_rules/build_convert_company_rules.sh"
            gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$ASSET" --dir release-download
            rm -rf extract && mkdir -p extract
            tar -xzf "release-download/${ASSET}" -C extract
            cp scripts/CR_rules/convert_company_rules extract/owlsm/bin/
            chmod +x extract/owlsm/bin/convert_company_rules
            cp scripts/CR_rules/field_mapping.yml extract/owlsm/resources/
            tar -czf "$OUT" -C extract owlsm
            ls -lh "$OUT"
          done

      - name: Publish tarballs to releases branch
        run: |
          set -e
          VERSION="${{ steps.meta.outputs.version }}"
          BRANCH="owlsm_cybereason_releases"
          WORKTREE="${{ runner.temp }}/cyber-rel"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH" || { echo "::error::Branch '$BRANCH' missing"; exit 1; }
          rm -rf "$WORKTREE"
          git worktree add -f "$WORKTREE" "origin/$BRANCH"
          published=""
          for attempt in 1 2 3; do
            git -C "$WORKTREE" fetch origin "$BRANCH"
            git -C "$WORKTREE" reset --hard "origin/$BRANCH"
            git -C "$WORKTREE" ls-files -z -- ':(exclude)*.tar.gz' \
              | xargs -0 -r git -C "$WORKTREE" rm -q -- || true
            for arch in x86_64 aarch64; do
              OUT="owlsm-${arch}-v${VERSION}-cybereason.tar.gz"
              cp "${{ github.workspace }}/$OUT" "$WORKTREE/$OUT"
              git -C "$WORKTREE" add -- "$OUT"
            done
            if git -C "$WORKTREE" diff --cached --quiet; then
              published=1; break
            fi
            git -C "$WORKTREE" commit -m "Publish cybereason ${{ steps.meta.outputs.tag }} (x86_64 + aarch64)"
            git -C "$WORKTREE" push origin "HEAD:$BRANCH" && { published=1; break; }
            echo "==> Push rejected (attempt $attempt); retrying..."
          done
          git worktree remove --force "$WORKTREE" || true
          [ -n "$published" ] || { echo "::error::Publish failed"; exit 1; }

      - name: Summary
        id: summary
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          BRANCH="owlsm_cybereason_releases"
          REPO="${{ github.repository }}"
          OUT_X64="owlsm-x86_64-v${VERSION}-cybereason.tar.gz"
          OUT_ARM="owlsm-aarch64-v${VERSION}-cybereason.tar.gz"
          echo "artifact_name=owlsm-*-v${VERSION}-cybereason" >> "$GITHUB_OUTPUT"
          echo "tarball=${OUT_X64},${OUT_ARM}" >> "$GITHUB_OUTPUT"
          echo "download_url=https://raw.githubusercontent.com/${REPO}/${BRANCH}/${OUT_X64}" >> "$GITHUB_OUTPUT"
          {
            echo "## Cybereason Artifacts Published"
            echo "| x86_64 | <https://raw.githubusercontent.com/${REPO}/${BRANCH}/${OUT_X64}> |"
            echo "| aarch64 | <https://raw.githubusercontent.com/${REPO}/${BRANCH}/${OUT_ARM}> |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      # (l) Cleanup workspace (mirrors build-artifacts)
      # ---------------------------------------------------------------
      - name: Cleanup workspace
        if: always()
        run: |
          echo "==> Cleaning up workspace..."
          docker rmi ${{ env.DOCKER_IMAGE }} || true
          cd ${{ github.workspace }}
          sudo git clean -ffdx
          echo "==> Cleanup completed!"

    outputs:
      artifact_name: ${{ steps.summary.outputs.artifact_name }}
      tarball: ${{ steps.summary.outputs.tarball }}
      download_url: ${{ steps.summary.outputs.download_url }}
