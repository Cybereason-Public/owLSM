name: Build Artifact Full Lifecycle

on:
  workflow_run:
    workflows:
      - "PR Approval Gate"
    types:
      - completed
  workflow_dispatch:
    inputs:
      create_tag:
        description: 'Create a Git tag for release'
        type: boolean
        default: false
      major:
        description: 'Major version'
        required: true
        default: '1'
        type: string
      minor:
        description: 'Minor version'
        required: true
        default: '0'
        type: string
      patch:
        description: 'Patch version'
        required: true
        default: '0'
        type: string
      arm:
        description: 'Build and test ARM (aarch64)'
        type: boolean
        default: true
      run_automation_tests:
        description: 'Run automation tests with runners'
        type: boolean
        default: true
      automation-tests-command-args:
        description: "Command to run automation tests"
        required: true
        type: string
        default: "features/ --junitxml=$AUTOMATION_ROOT_DIR/results.xml -v -s"
      destroy_runners:
        description: 'Destroy runner VMs after tests'
        type: boolean
        default: true
      ephemeral_runners:
        description: 'Make runners ephemeral (unregister after first job)'
        type: boolean
        default: true

env:
  DOCKER_IMAGE: ghcr.io/cybereason-public/owlsm-ci:latest
  # Use inputs if workflow_dispatch, otherwise default to 1.0.0 for push triggers
  VERSION: ${{ github.event.inputs.major || '1' }}.${{ github.event.inputs.minor || '0' }}.${{ github.event.inputs.patch || '0' }}
  # workflow_run / create_tag: always ARM. workflow_dispatch: checkbox (default on).
  BUILD_ARM: ${{ github.event_name != 'workflow_dispatch' || inputs.arm == true || inputs.create_tag == true }}

jobs:
  build:
    name: Build Artifact
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ["OCI", "owLSM"]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for revision info
          # For workflow_run (fork PR): check out the PR's head commit.
          # For workflow_dispatch: falls back to the default sha (HEAD).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.create_tag }}" = "true" ] && [ "${{ inputs.run_automation_tests }}" != "true" ]; then
            echo "::error::create_tag=true requires run_automation_tests=true (aarch64 unit tests run with automation)."
            exit 1
          fi

      - name: Get branch info
        id: branch_info
        run: |
          BRANCH_NAME=${GITHUB_REF_NAME//\//-}  # Replace / with -
          BRANCH_REVISION=$(git rev-parse --short HEAD)
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "branch_revision=$BRANCH_REVISION" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH_NAME"
          echo "Revision: $BRANCH_REVISION"

      - name: Enable QEMU / prepare aarch64 workspace
        if: env.BUILD_ARM == 'true'
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all
          sudo rm -rf /tmp/owlsm-aarch64
          cp -a "${{ github.workspace }}" /tmp/owlsm-aarch64

      - name: Pull CI Docker image
        run: |
          docker pull --platform linux/amd64 ${{ env.DOCKER_IMAGE }}
          if [ "${{ env.BUILD_ARM }}" = "true" ]; then
            docker pull --platform linux/arm64 ${{ env.DOCKER_IMAGE }}
          fi

      - name: Run RulesGenerator unit tests
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ env.DOCKER_IMAGE }} \
            bash -c "
              set -e
              cd Rules/RulesGenerator
              uv venv venv
              source venv/bin/activate
              uv pip install -r requirements.txt
              python3 -m pytest Tests/ -v
            "

      - name: Build artifacts (x86_64 + optional aarch64 in parallel)
        run: |
          set -e
          build_one() {
            docker run --rm --platform "$1" -v "$2:/workspace" -w /workspace \
              ${{ env.DOCKER_IMAGE }} \
              bash -c "set -e
                make -j\$(nproc) VERSION=${{ env.VERSION }}
                make test -j\$(nproc)
                make automation
                ls -la ./build/"
          }
          build_one linux/amd64 "${{ github.workspace }}" &
          PID_X64=$!
          PID_ARM=""
          if [ "${{ env.BUILD_ARM }}" = "true" ]; then
            build_one linux/arm64 /tmp/owlsm-aarch64 &
            PID_ARM=$!
          fi
          FAIL=0
          wait "$PID_X64" || FAIL=1
          if [ -n "$PID_ARM" ]; then
            wait "$PID_ARM" || FAIL=1
          fi
          exit "$FAIL"

      - name: Run x86_64 unit tests
        run: |
          sudo chmod +x ./build/unit_tests/bin/unit_tests
          sudo ./build/unit_tests/bin/unit_tests

      - name: Create CI archives
        id: archive
        run: |
          set -e
          BASE="${{ env.VERSION }}-${{ steps.branch_info.outputs.branch_name }}-${{ steps.branch_info.outputs.branch_revision }}"
          pack() {
            local arch="$1" src="$2"
            local name="${BASE}-${arch}"
            tar czf "/tmp/${name}.tar.gz" --dereference \
              --exclude='.git*' --exclude='.github*' --exclude='*.o' \
              --exclude='venv' --exclude='.uv-cache' --exclude='.cache' \
              -C "$src" .
            echo "artifact_name_${arch}=${name}" >> "$GITHUB_OUTPUT"
            ls -lh "/tmp/${name}.tar.gz"
          }
          pack x86_64 "${{ github.workspace }}"
          [ "${{ env.BUILD_ARM }}" = "true" ] && pack aarch64 /tmp/owlsm-aarch64
          echo "artifact_base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Upload CI artifact (x86_64)
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.archive.outputs.artifact_name_x86_64 }}
          path: /tmp/${{ steps.archive.outputs.artifact_name_x86_64 }}.tar.gz
          retention-days: 30

      - name: Upload CI artifact (aarch64)
        if: env.BUILD_ARM == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.archive.outputs.artifact_name_aarch64 }}
          path: /tmp/${{ steps.archive.outputs.artifact_name_aarch64 }}.tar.gz
          retention-days: 30

      - name: Create release tarballs
        if: inputs.create_tag == true
        run: |
          set -e
          V="${{ env.VERSION }}"
          pack_rel() {
            local arch="$1" root="$2"
            sudo tar -czf "/tmp/owlsm-${arch}-v${V}.tar.gz" -C "${root}/build" owlsm
            sha256sum "/tmp/owlsm-${arch}-v${V}.tar.gz" | sudo tee "/tmp/checksum-${arch}-v${V}.txt"
          }
          pack_rel x86_64 "${{ github.workspace }}"
          [ "${{ env.BUILD_ARM }}" = "true" ] && pack_rel aarch64 /tmp/owlsm-aarch64

      - name: Upload release artifact (x86_64)
        if: inputs.create_tag == true
        uses: actions/upload-artifact@v5
        with:
          name: release-owlsm-x86_64-${{ env.VERSION }}
          path: |
            /tmp/owlsm-x86_64-v${{ env.VERSION }}.tar.gz
            /tmp/checksum-x86_64-v${{ env.VERSION }}.txt
          retention-days: 90

      - name: Upload release artifact (aarch64)
        if: inputs.create_tag == true && env.BUILD_ARM == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: release-owlsm-aarch64-${{ env.VERSION }}
          path: |
            /tmp/owlsm-aarch64-v${{ env.VERSION }}.tar.gz
            /tmp/checksum-aarch64-v${{ env.VERSION }}.txt
          retention-days: 90

      - name: Summary
        run: |
          {
            echo "## Build Summary"
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Version | ${{ env.VERSION }} |"
            echo "| Branch | ${{ steps.branch_info.outputs.branch_name }} |"
            echo "| ARM | ${{ env.BUILD_ARM }} |"
            echo "| CI x86_64 | ${{ steps.archive.outputs.artifact_name_x86_64 }} |"
            [ "${{ env.BUILD_ARM }}" = "true" ] && \
              echo "| CI aarch64 | ${{ steps.archive.outputs.artifact_name_aarch64 }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup workspace
        if: always()
        run: |
          docker rmi ${{ env.DOCKER_IMAGE }} || true
          sudo rm -rf /tmp/owlsm-aarch64
          cd ${{ github.workspace }}
          sudo git clean -ffdx

    outputs:
      artifact_base: ${{ steps.archive.outputs.artifact_base }}
      commit_sha: ${{ steps.branch_info.outputs.commit_sha }}
      build_arm: ${{ env.BUILD_ARM }}

  automation-tests-runners:
    name: Create runners and run automation tests
    needs: [build]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.run_automation_tests == true) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success'))
    uses: ./.github/workflows/automation-tests-runners.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact_base }}
      enable_arm: ${{ needs.build.outputs.build_arm == 'true' }}
      automation-tests-command-args: ${{ inputs.automation-tests-command-args || 'features/ --junitxml=$AUTOMATION_ROOT_DIR/results.xml -v -s' }}
      destroy_runners: ${{ github.event_name != 'workflow_dispatch' || inputs.destroy_runners }}
      ephemeral_runners: ${{ github.event_name != 'workflow_dispatch' || inputs.ephemeral_runners }}
    secrets:
      GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}

  create-tag:
    name: Create Git tag
    needs: [build, automation-tests-runners]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.create_tag == true &&
      needs.build.result == 'success' &&
      needs.automation-tests-runners.result == 'success'
    runs-on: ["OCI", "owLSM"]
    permissions:
      contents: write
    steps:
      - name: Create tag via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_PAT }}
        run: |
          TAG="v${{ env.VERSION }}"
          SHA="${{ needs.build.outputs.commit_sha }}"
          echo "==> Creating tag: $TAG (sha: $SHA)"

          gh api "/repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${SHA}"
          echo "==> Tag $TAG created successfully"

      - name: Summary
        run: |
          echo "## Tag Created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | v${{ env.VERSION }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release Artifact | release-owlsm-${{ env.VERSION }} |" >> "$GITHUB_STEP_SUMMARY"