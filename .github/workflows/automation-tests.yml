name: Automation Tests

# =============================================================================
# Runs automation tests on a specific self-hosted runner provisioned by
# the Prepare Runners workflow. Downloads the build artifact via GH API,
# extracts it to /opt, and executes the pytest automation suite.
#
# Designed to be called from prepare-runners.yml using matrix strategy.
# =============================================================================

on:
  workflow_call:
    inputs:
      runner-label:
        description: "Individual runner distro label (e.g., ubuntu-22)"
        required: true
        type: string
      artifact-name:
        description: "Base build artifact name (without -x86_64/-aarch64 suffix)"
        required: true
        type: string
      automation-tests-command-args:
        description: "Command to run automation tests"
        required: true
        type: string
        default: "features/ --junitxml=$AUTOMATION_ROOT_DIR/results.xml -v -s"
    secrets:
      GH_RUNNER_PAT:
        required: true

env:
  AUTOMATION_ROOT_DIR: /opt/owLSM/src/Tests/Automation

jobs:
  automation-tests:
    name: "Run Tests (${{ inputs.runner-label }})"
    runs-on: ["run-${{ github.run_id }}", "${{ inputs.runner-label }}"]

    steps:
      # Needed so the local composite action under .github/actions/ is available
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download CI artifact
        uses: ./.github/actions/download-ci-artifact
        with:
          artifact-name-base: ${{ inputs.artifact-name }}
          github-token: ${{ secrets.GH_RUNNER_PAT }}
          extract-path: /opt/owLSM

      - name: Ensure uv is installed
        run: |
          if command -v uv &>/dev/null; then
            echo "==> uv already installed: $(uv --version)"
          else
            echo "==> uv not found, installing..."
            curl -Lf https://astral.sh/uv/install.sh | sudo env INSTALLER_NO_MODIFY_PATH=1 sh
            sudo mv /root/.local/bin/uv /usr/bin/uv
            sudo mv /root/.local/bin/uvx /usr/bin/uvx
            echo "==> uv installed: $(uv --version)"
          fi

      - name: Setup venv and install requirements
        run: |
          cd $AUTOMATION_ROOT_DIR
          uv venv venv --clear
          source venv/bin/activate
          uv pip install -r requirements.txt
          echo "==> venv ready: $(pytest --version)"

      - name: Run automation tests
        run: |
          cd $AUTOMATION_ROOT_DIR
          sudo PYTHONPATH=$AUTOMATION_ROOT_DIR $AUTOMATION_ROOT_DIR/venv/bin/pytest ${{inputs.automation-tests-command-args}}

      - name: Collect debug logs
        id: collect_logs
        if: failure() || cancelled()
        run: |
          sudo python3 /opt/owLSM/scripts/zip_logs.py \
            --automation-dir "$AUTOMATION_ROOT_DIR" \
            --output-dir /tmp/collected_logs
          ZIP_PATH=$(ls /tmp/collected_logs/*.zip)
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload debug logs
        if: (failure() || cancelled()) && steps.collect_logs.outputs.zip_path != ''
        uses: actions/upload-artifact@v5
        with:
          name: debug-logs-${{ inputs.runner-label }}
          path: ${{ steps.collect_logs.outputs.zip_path }}
          retention-days: 14

      - name: Rename results file
        if: always()
        run: mv ${{ env.AUTOMATION_ROOT_DIR }}/results.xml ${{ env.AUTOMATION_ROOT_DIR }}/results-${{ inputs.runner-label }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: automation-test-results-${{ inputs.runner-label }}
          path: ${{ env.AUTOMATION_ROOT_DIR }}/results-${{ inputs.runner-label }}.xml
          retention-days: 30
