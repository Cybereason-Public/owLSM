name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true
        type: string
        default: "1.0.0"
      release_name:
        description: 'Release name (defaults to tag if empty)'
        required: false
        type: string

jobs:
  release:
    name: Publish Release
    runs-on: ["OCI", "owLSM"]
    permissions:
      contents: write
    steps:
      - name: Validate version and resolve metadata
        id: meta
        run: |
          VERSION="${{ inputs.tag_version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match X.Y.Z format, got '$VERSION'"
            exit 1
          fi
          TAG="v${VERSION}"
          RELEASE_NAME="${{ inputs.release_name }}"
          [ -z "$RELEASE_NAME" ] && RELEASE_NAME="$TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify tag exists
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/${{ steps.meta.outputs.tag }}" || {
            echo "::error::Tag ${{ steps.meta.outputs.tag }} does not exist. Run Build Artifact Full Lifecycle with create_tag=true first."
            exit 1
          }

      - name: Download release artifacts (both arches)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ steps.meta.outputs.version }}"
          REPO="${{ github.repository }}"
          mkdir -p release-assets
          for arch in x86_64 aarch64; do
            name="release-owlsm-${arch}-${VERSION}"
            json=$(gh api "/repos/${REPO}/actions/artifacts?name=${name}&per_page=1" --jq '.artifacts[0]')
            [ -z "$json" ] || [ "$json" = "null" ] && { echo "::error::Artifact '$name' not found"; exit 1; }
            [ "$(echo "$json" | jq -r '.expired')" = "true" ] && { echo "::error::Artifact '$name' expired"; exit 1; }
            id=$(echo "$json" | jq -r '.id')
            gh api "/repos/${REPO}/actions/artifacts/${id}/zip" > "/tmp/${name}.zip"
            unzip -o "/tmp/${name}.zip" -d "release-assets/${arch}"
            cp "release-assets/${arch}/owlsm-${arch}-v${VERSION}.tar.gz" release-assets/
            cp "release-assets/${arch}/checksum-${arch}-v${VERSION}.txt" release-assets/
          done
          ls -lh release-assets/*.tar.gz release-assets/checksum-*.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          generate_release_notes: true
          files: |
            release-assets/owlsm-x86_64-v${{ steps.meta.outputs.version }}.tar.gz
            release-assets/owlsm-aarch64-v${{ steps.meta.outputs.version }}.tar.gz
            release-assets/checksum-x86_64-v${{ steps.meta.outputs.version }}.txt
            release-assets/checksum-aarch64-v${{ steps.meta.outputs.version }}.txt

      - name: Summary
        run: |
          {
            echo "## Release Published"
            echo "| Tag | ${{ steps.meta.outputs.tag }} |"
            echo "| Assets | owlsm-{x86_64,aarch64}-v* + checksums |"
          } >> "$GITHUB_STEP_SUMMARY"
